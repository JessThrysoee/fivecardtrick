<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="A small game based on Fitch Cheney's Five Card Trick, where the challenge is to pick the hidden card as fast as possible."
        />

        <title>Fitch Cheney's Five Card Trick</title>
        <link rel="stylesheet" href="index.css" />
    </head>
    <body>
        <main class="content">
            <div class="head">
                <h1>Fitch Cheney's Five Card Trick</h1>

                <div>
                    <span style="color: red">♦</span> &lt; <span style="color: red">♥</span> &lt; <span style="color: black">♠</span> &lt;
                    <span style="color: black">♣</span>
                </div>
            </div>

            <div class="card-container">
                <div id="faceDown" class="flip-container revealed">
                    <div id="flipper" class="flipper">
                        <div class="front" aria-hidden="true">
                            <div class="card facedown">
                                <img src="img/back.svg" alt="Face-down card" />
                            </div>
                        </div>
                        <div class="back">
                            <div class="card">
                                <img id="card0" src="img/clear.gif" alt="" />
                            </div>
                            <div id="answer-hand" class="answer-hand"></div>
                        </div>
                    </div>
                </div>

                <div class="stack">
                    <div class="card one">
                        <img id="card1" src="img/clear.gif" alt="" />
                    </div>
                    <div class="card two">
                        <img id="card2" src="img/clear.gif" alt="" />
                    </div>
                    <div class="card three">
                        <img id="card3" src="img/clear.gif" alt="" />
                    </div>
                    <div class="card four">
                        <img id="card4" src="img/clear.gif" alt="" />
                    </div>
                </div>
            </div>

            <div class="button-container">
                <button
                    type="button"
                    id="shuffle-button"
                    class="shuffle-button"
                    title="keyboard shortcut: spacebar. Answer with A, 2–9, 0, J, Q, K"
                    aria-keyshortcuts="Space"
                >
                    New Game
                </button>
                <div id="answer-cards" class="answer-cards" role="group" aria-label="Pick the hidden card"></div>
            </div>

            <div class="statistics">
                <div id="game-won" class="alert" hidden>
                    <div class="game-won">We have a WINNER with an average time of <span id="game-won-avg"></span></div>
                </div>
                <div id="game-won-new-best" class="alert" hidden>
                    <div class="game-won-new-best">
                        We have a WINNER with new BEST average time of <span id="game-won-new-best-avg"></span>
                    </div>
                </div>
                <div id="game-over" class="alert" hidden>
                    <div class="game-over">
                        <a target="_blank" href="https://www.youtube.com/watch?v=u2ycDWywGls">Game Over Man, GAME OVER!</a>
                    </div>
                </div>

                <div class="statistics-header">
                    <div id="shuffles-cur-of-max" class="shuffles-cur-of-max"></div>
                    <div id="avg-best" class="avg-best"></div>
                    <div id="avg-cur" class="avg-cur"></div>
                </div>
                <table id="statistics-list" class="statistics-list"></table>
            </div>
        </main>
        <script src="index.js"></script>
    </body>
</html>
